name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-check:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node后端
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: node后端/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  admin-check:
    name: Admin Web Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 管理后台
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 管理后台/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
